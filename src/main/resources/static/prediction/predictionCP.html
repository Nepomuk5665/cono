<!DOCTYPE html>
<html>
<head>
    <title>Erst Prediction Control Panel</title>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            background: #1a1a1a;
            font-family: Arial, sans-serif;
            font-size: 15px; color: #e0e0e0;
            display: flex; flex-direction: column; height: 100vh;
        }
        #workspace { flex: 1; display: flex; min-height: 0; }
        #sidebar {
            width: 340px; flex-shrink: 0; background: #1a1a1a;
            border-right: 1px solid #2a2a2a; display: flex; flex-direction: column; overflow: hidden;
        }
        #controls {
            flex: 1; overflow-y: auto; overflow-x: hidden;
            scrollbar-width: thin; scrollbar-color: #2e2e2e #131313;
        }
        #controls::-webkit-scrollbar { width: 4px; }
        #controls::-webkit-scrollbar-track { background: #131313; }
        #controls::-webkit-scrollbar-thumb { background: #2e2e2e; }

        #actionPanel {
            flex-shrink: 0; padding: 10px 12px 8px; background: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
        }
        #actionPanel .ap-title {
            font: 11px Arial, sans-serif; color: #aaa; letter-spacing: .05em;
            text-transform: uppercase; margin-bottom: 8px;
        }
        .ap-step {
            display: flex; align-items: center; gap: 9px; width: 100%;
            background: transparent; border: 1px solid #333;
            color: #ccc; padding: 6px 10px; margin-bottom: 3px;
            font: 13px Arial, sans-serif;
            cursor: pointer; text-align: left;
            transition: background .1s, border-color .1s, color .1s;
        }
        .ap-step:hover { background: #252525; color: #fff; border-color: #444; }
        .ap-step .step-num {
            width: 18px; height: 18px; border-radius: 50%; border: 1px solid #555;
            font: 9px Arial, sans-serif; color: #aaa;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: all .15s;
        }
        .ap-step .step-label { flex: 1; font-weight: 500; }
        .ap-step.next   { border-color: #00d4ff55; color: #00d4ff; background: rgba(0,212,255,.04); }
        .ap-step.next .step-num { border-color: #00d4ff77; color: #00d4ff; }
        .ap-step.active { border-color: #00d4ff; color: #fff; background: rgba(0,212,255,.09); }
        .ap-step.active .step-num { background: #00d4ff; border-color: #00d4ff; color: #000; font-weight: 700; }
        .ap-step.done { opacity: .3; border-color: #1c1c1c; pointer-events: none; }
        .ap-step.done .step-num { background: #1c1c1c; border-color: #1c1c1c; color: #444; }
        .ap-step.ap-winner.next { border-color: #f5c84266; color: #f5c842; background: rgba(245,200,66,.04); }
        .ap-step.ap-winner.next .step-num { border-color: #f5c84288; color: #f5c842; }
        .ap-step.ap-winner.active { border-color: #f5c842; color: #fff; background: rgba(245,200,66,.09); }
        .ap-step.ap-winner.active .step-num { background: #f5c842; border-color: #f5c842; color: #000; }

        .ap-hr { border: none; border-top: 1px solid #1e1e1e; margin: 7px 0 6px; }
        .ap-danger-row { display: flex; gap: 5px; }
        .ap-danger-btn {
            flex: 1; background: transparent; border: 1px solid #333;
            color: #ccc; padding: 5px 8px;
            font: 12px Arial, sans-serif;
            cursor: pointer; text-align: center;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            transition: all .1s;
        }
        .ap-danger-btn:hover { color: #ff6644; border-color: #ff442244; background: rgba(180,40,0,.07); }
        .ap-emergency { border-color: #333; color: #ccc; }
        .ap-emergency:hover { color: #ff4422; border-color: #ff442244; background: rgba(200,30,0,.12); }

        /* Winner selector inline */
        .ap-winner-pick {
            margin-top: 5px; padding-top: 5px; border-top: 1px dashed #1e1e1e;
        }
        .ap-winner-pick .sub { font-size: 10px; color: #777; margin-bottom: 4px; letter-spacing: .05em; }
        .ap-winner-btn {
            background: transparent; border: 1px solid #333;
            color: #ccc; padding: 4px 9px; margin: 0 3px 3px 0;
            font: 11px Arial, sans-serif;
            cursor: pointer;
            transition: all .1s;
        }
        .ap-winner-btn:hover { color: #f5c842; border-color: #f5c84266; }

        .sec { border-bottom: 1px solid #1c1c1c; }
        .sec.sec-first { border-top: none; }
        .sec.sec-first .sec-head .sec-title { color: #ddeeff; }
        .sec-head {
            display: flex; align-items: center; gap: 8px;
            padding: 9px 14px; cursor: pointer; user-select: none;
        }
        .sec-head::after { content: '▾'; margin-left: auto; color: #333; font-size: 10px; transition: transform .15s; }
        .sec-head.collapsed::after { transform: rotate(-90deg); }
        .sec-head .sec-title { font-size: 13px; font-weight: 600; color: #999; }
        .sec.sec-first .sec-head::after { color: #00d4ff44; }
        .sec-body { padding: 4px 14px 12px; display: flex; flex-direction: column; gap: 8px; }
        .sec-body.collapsed { display: none; }

        .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .lbl  { font-size: 13px; color: #aaa; flex: 1; }
        .lbl2 { font-size: 12px; color: #888; white-space: nowrap; width: 44px; }

        .range-row { display: flex; align-items: center; gap: 7px; }
        input[type=range] {
            flex: 1; cursor: pointer; appearance: none; -webkit-appearance: none;
            height: 4px; background: #2a2a2a; border-radius: 2px; outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 14px; height: 14px;
            border-radius: 50%; background: #aaa; cursor: pointer;
        }
        .rval { font-size: 12px; color: #888; width: 30px; text-align: right; }

        input[type=number], input[type=text], select {
            background: #1c1c1c; border: 1px solid #2a2a2a;
            color: #fff; padding: 4px 8px;
            font: 13px Arial, sans-serif;
        }
        input[type=number] { width: 64px; }
        input[type=number]:focus, input[type=text]:focus, select:focus { outline: none; border-color: #555; }

        .btns { display: flex; gap: 5px; flex-wrap: wrap; }
        .tog {
            background: #1c1c1c; border: 1px solid #2a2a2a; color: #666; padding: 4px 10px;
            font: 12px Arial, sans-serif;
            cursor: pointer; transition: all .1s;
        }
        .tog:hover { color: #ddd; border-color: #444; }
        .tog.on { color: #fff; border-color: #555; background: rgba(255,255,255,.07); }
        .tog.danger { color: #553322; border-color: #332211; }
        .tog.danger:hover { color: #ff6622; border-color: #553311; background: rgba(150,40,0,.12); }

        .pos-grid { display: grid; grid-template-columns: repeat(3, 26px); gap: 3px; }
        .pos-cell { height: 17px; background: #555; border: 1px solid #888; cursor: pointer; transition: all .1s; }
        .pos-cell.on { background: rgba(255,255,255,.18); border-color: #aaa; }

        .sub { font-size: 12px; color: #888; margin-bottom: 4px; }
        .inline { display: flex; align-items: center; gap: 7px; }

        /* Outcomes editor */
        .out-row {
            display: grid; grid-template-columns: 16px 1fr 80px 70px 18px;
            gap: 5px; align-items: center;
        }
        .out-row .out-num {
            font: 10px Arial, sans-serif; color: #666; text-align: center;
        }
        .out-row .out-num.is-blue { color: #66b8ff; font-weight: bold; }
        .out-row .out-num.is-pink { color: #ff7eb3; font-weight: bold; }
        .out-row input[type=text] { width: 100%; }
        .out-row input[type=number] { width: 100%; }
        .out-del {
            background: transparent; border: none; color: #444; cursor: pointer;
            font: 14px Arial, sans-serif; line-height: 1;
        }
        .out-del:hover { color: #ff4444; }
        .out-add-btn {
            width: 100%; background: transparent; border: 1px dashed #2a2a2a;
            color: #555; padding: 5px; font: 12px Arial, sans-serif;
            cursor: pointer; transition: all .1s;
        }
        .out-add-btn:hover { color: #00d4ff; border-color: #00d4ff44; }
        .out-add-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        #rightCol { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        #preview-area {
            flex: 1; background: #0d0d0d;
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden; min-height: 0;
        }
        #preview-wrap { position: relative; flex-shrink: 0; cursor: default; background: #0d0d0d; }
        #previewBg { width: 1920px; height: 1080px; background: #0d0d0d; position: relative; }
        .preview-label {
            position: absolute; bottom: 8px; right: 12px;
            font-size: 11px; color: #222; letter-spacing: .5px; pointer-events: none;
        }

        /* Live monitor strip at top */
        #liveMonitor {
            flex-shrink: 0; padding: 8px 14px; background: #131313;
            border-bottom: 1px solid #2a2a2a;
            display: flex; align-items: center; gap: 10px;
        }
        #live-state {
            display: inline-block;
            font: 10px Arial, sans-serif;
            letter-spacing: 0.2em;
            padding: 2px 8px;
            border-radius: 2px;
            border: 1px solid #44303a;
            color: #888;
            text-transform: uppercase;
            font-weight: bold;
        }
        #live-state.s-start    { border-color: #66b8ff; color: #66b8ff; }
        #live-state.s-progress { border-color: #b890ff; color: #b890ff; }
        #live-state.s-locked   { border-color: #ffd54f; color: #ffd54f; }
        #live-state.s-end      { border-color: #aaa;    color: #aaa;    }
        #live-title { font-size: 12px; color: #888; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body>
<div id="workspace">
<div id="sidebar">
    <div id="actionPanel">
        <div class="ap-title">Prediction Workflow</div>
        <button class="ap-step" id="apStart">
            <span class="step-num">1</span>
            <span class="step-label">Start Prediction</span>
        </button>
        <button class="ap-step" id="apProgress">
            <span class="step-num">2</span>
            <span class="step-label">Update Points</span>
        </button>
        <button class="ap-step" id="apLocked">
            <span class="step-num">3</span>
            <span class="step-label">Lock Prediction</span>
        </button>
        <button class="ap-step ap-winner" id="apResolve">
            <span class="step-num">4</span>
            <span class="step-label">Resolve Winner</span>
        </button>
        <div class="ap-winner-pick" id="apWinnerPick" style="display:none">
            <div class="sub">Pick winner:</div>
            <div id="apWinnerBtns"></div>
        </div>
        <hr class="ap-hr">
        <button class="ap-step" id="apTest" style="border-color:#44aa6655;color:#6c6;margin-bottom:6px">
            <span class="step-num" style="border-color:#44aa6655;color:#6c6">T</span>
            <span class="step-label">Run Full Test (Dev)</span>
        </button>
        <hr class="ap-hr">
        <div class="ap-danger-row">
            <button class="ap-danger-btn" id="apCancel">Cancel</button>
            <button class="ap-danger-btn ap-emergency" id="apHide">Hide Now</button>
        </div>
    </div>
    <div id="controls">

        <div class="sec sec-first" data-sec-id="position">
            <div class="sec-head" data-sec="position">
                <span class="sec-title">Position &amp; Size</span>
            </div>
            <div class="sec-body" id="sec-position">
                <div class="inline" style="gap:14px;align-items:flex-start">
                    <div>
                        <div class="sub">Anchor</div>
                        <div class="pos-grid" id="posGrid">
                            <div class="pos-cell on" data-pos="top-left"></div>
                            <div class="pos-cell"    data-pos="top-center"></div>
                            <div class="pos-cell"    data-pos="top-right"></div>
                            <div class="pos-cell"    data-pos="middle-left"></div>
                            <div class="pos-cell"    data-pos="center"></div>
                            <div class="pos-cell"    data-pos="middle-right"></div>
                            <div class="pos-cell"    data-pos="bottom-left"></div>
                            <div class="pos-cell"    data-pos="bottom-center"></div>
                            <div class="pos-cell"    data-pos="bottom-right"></div>
                        </div>
                    </div>
                    <div style="display:flex;flex-direction:column;gap:6px">
                        <div class="inline"><span class="lbl2">X</span><input type="number" id="panelX" value="60"></div>
                        <div class="inline"><span class="lbl2">Y</span><input type="number" id="panelY" value="60"></div>
                        <div class="inline"><span class="lbl2">Width</span><input type="number" id="panelW" value="480"></div>
                    </div>
                </div>
                <div class="btns">
                    <button class="tog" id="resetPos">Reset Pos</button>
                    <button class="tog" id="resetSize">Reset Size</button>
                </div>
            </div>
        </div>

        <div class="sec" data-sec-id="panel">
            <div class="sec-head" data-sec="panel">
                <span class="sec-title">Timing</span>
            </div>
            <div class="sec-body" id="sec-panel">
                <div class="row"><span class="lbl">Bar speed</span>
                    <div class="range-row" style="flex:1">
                        <input type="range" id="barEasing" min="1" max="20" step="1" value="8">
                        <span class="rval" id="barEasingVal" style="width:36px">0.08</span>
                    </div>
                </div>
                <div class="row"><span class="lbl">Max outcomes shown</span>
                    <div class="range-row" style="flex:1">
                        <input type="range" id="maxOpts" min="2" max="10" step="1" value="10">
                        <span class="rval" id="maxOptsVal">10</span>
                    </div>
                </div>
                <div class="row"><span class="lbl">Result reveal (ms)</span>
                    <input type="number" id="resultRevealMs" value="2800" style="width:70px">
                </div>
                <div class="row"><span class="lbl">Linger (ms)</span>
                    <input type="number" id="lingerMs" value="7000" style="width:70px">
                </div>
            </div>
        </div>

        <div class="sec" data-sec-id="title">
            <div class="sec-head" data-sec="title">
                <span class="sec-title">Question</span>
            </div>
            <div class="sec-body" id="sec-title">
                <input type="text" id="cp-title" value="Is this going to work?" style="width:100%">
            </div>
        </div>

        <div class="sec" data-sec-id="outcomes">
            <div class="sec-head" data-sec="outcomes">
                <span class="sec-title">Outcomes</span>
            </div>
            <div class="sec-body" id="sec-outcomes">
                <div class="inline" style="margin-bottom:4px">
                    <span class="sub" style="flex:1; margin:0">Title · Points · Predictors</span>
                </div>
                <div id="cp-outcomes-form"></div>
                <button class="out-add-btn" id="cp-btn-add">+ Add outcome (max 10)</button>
            </div>
        </div>

    </div>
</div>
<div id="rightCol">
    <div id="liveMonitor">
        <span id="live-state">Idle</span>
        <span id="live-title">No active prediction</span>
    </div>
    <div id="preview-area">
        <div id="preview-wrap">
            <div id="previewBg">
                <div id="predictionPanelRoot"
                     style="position:absolute;top:0;left:0;width:1920px;height:1080px;pointer-events:none;overflow:hidden;z-index:2;"></div>
            </div>
        </div>
        <span class="preview-label">1920 × 1080</span>
    </div>
</div>
</div>

<script src="/webjars/jquery/jquery.min.js"></script>
<script src="/webjars/sockjs-client/sockjs.min.js"></script>
<script src="/webjars/stomp-websocket/stomp.min.js"></script>
<script src="/utils/Backend.js"></script>
<script src="predictionPanel.js?v=6"></script>
<script src="predictionCP.js?v=6"></script>
<script>
    function scalePreview(){
        const area = document.getElementById('preview-area');
        const wrap = document.getElementById('preview-wrap');
        const bg   = document.getElementById('previewBg');
        if(!area || !bg) return;
        const scale = Math.min(area.clientWidth / 1920, area.clientHeight / 1080);
        const sw = Math.round(1920 * scale), sh = Math.round(1080 * scale);
        if(wrap){ wrap.style.width = sw + 'px'; wrap.style.height = sh + 'px'; }
        bg.style.transform = 'scale(' + scale + ')';
        bg.style.transformOrigin = 'top left';
    }
    window.addEventListener('resize', scalePreview);
    document.addEventListener('DOMContentLoaded', scalePreview);
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Poll Overlay</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
        #chickenContainer { position: fixed; top: 0; left: 0; pointer-events: none; }
        canvas { outline: none; border: none; }
    </style>
</head>
<body>
    <div id="chickenContainer"></div>
    <div id="pollPanelRoot" style="position:fixed;top:0;left:0;width:1920px;height:1080px;pointer-events:none;overflow:hidden;z-index:2;"></div>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="/webjars/jquery/jquery.min.js"></script>
    <script src="/webjars/sockjs-client/sockjs.min.js"></script>
    <script src="/webjars/stomp-websocket/stomp.min.js"></script>
    <script src="/utils/Backend.js"></script>
    <script src="poll.js"></script>
    <script src="pollChicken.js"></script>
    <script src="pollPanel.js"></script>
    <script>$(()=>{ new Backend(onBackendConnect); });</script>
</body>
</html>
